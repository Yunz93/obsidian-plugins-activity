name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          MANIFEST_VERSION="$(jq -r '.version' manifest.json)"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format: $TAG"
            exit 1
          fi

          if [[ "$VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Tag version ($VERSION) does not match manifest.json ($MANIFEST_VERSION)"
            exit 1
          fi

          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version ($VERSION) does not match package.json ($PACKAGE_VERSION)"
            exit 1
          fi

          if ! jq -e --arg version "$VERSION" 'has($version)' versions.json >/dev/null; then
            echo "versions.json is missing entry for $VERSION"
            exit 1
          fi

          echo "Release version validated: $VERSION"

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css
          test -f versions.json

      - name: Package release assets
        run: |
          mkdir -p dist
          cp main.js manifest.json styles.css versions.json dist/
          cd dist && zip -r ../plugins-activity.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/versions.json
            plugins-activity.zip
